name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows installer + portable
        run: npm run dist
        env:
          # electron-builder publishes nothing here; token avoids rate-limit noise on Electron download
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Papple-*-Setup.exe
            dist/Papple-*-portable.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
